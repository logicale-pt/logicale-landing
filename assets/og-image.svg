<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F343C"/>
      <stop offset="1" stop-color="#272C33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="52%">
      <stop offset="0" stop-color="#788696" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#788696" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#788696" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C2693B" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#C2693B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle frame -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#F0EBE0" stroke-opacity="0.12"/>

  <!-- copper glow behind the mark -->
  <circle cx="600" cy="240" r="170" fill="url(#copperGlow)"/>

  <!-- lambda mark (inverted V) — copper -->
  <path d="M520 322 L600 158 L680 322" fill="none" stroke="#C2693B" stroke-width="28"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="600" y="452" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700"
        font-size="116" letter-spacing="-3" fill="#F0EBE0">LOGICALE</text>

  <!-- tagline -->
  <text x="600" y="522" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500"
        font-size="38" letter-spacing="-0.5" fill="#F0EBE0" fill-opacity="0.78">Automação com IA para o teu negócio.</text>
</svg>
