<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F343C"/>
      <stop offset="1" stop-color="#272C33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#788696" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#788696" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#788696" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle frame -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#F0EBE0" stroke-opacity="0.12"/>

  <!-- lambda mark -->
  <path d="M548 196 L600 96 L652 196" fill="none" stroke="#F0EBE0" stroke-width="13"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="600" y="330" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700"
        font-size="118" letter-spacing="-3" fill="#F0EBE0">LOGICALE</text>

  <!-- tagline -->
  <text x="600" y="408" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500"
        font-size="40" letter-spacing="-0.5" fill="#F0EBE0" fill-opacity="0.78">Automação com IA para o teu negócio.</text>

  <!-- eyebrow -->
  <text x="600" y="498" text-anchor="middle"
        font-family="'Geist Mono', 'Courier New', monospace" font-weight="500"
        font-size="22" letter-spacing="5" fill="#F0EBE0" fill-opacity="0.55">PMES PORTUGUESAS · AUTOMAÇÃO</text>
</svg>
